server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        # Clean URLs: /docs -> docs.html
        try_files $uri $uri.html $uri/ /404.html;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
